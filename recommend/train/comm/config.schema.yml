type: object
properties:
  config_version:
    enum:
    - doku-train-config/v2
  model_name:
    type: string
    pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$
  model_type:
    enum:
    - rerank
    - rerank_tree
  dataset:
    type: object
    properties:
      manifest_uri: &id001
        type: string
        minLength: 1
    required: [manifest_uri]
    additionalProperties: false
  split:
    type: object
    properties:
      train_dates: &dates
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, format: date}
      validation_dates: *dates
      test_dates: *dates
      timezone: *id001
      train_from: *id001
      train_to: *id001
      validation_from: *id001
      validation_to: *id001
      test_from: *id001
      test_to: *id001
    required:
    - timezone
    - train_from
    - train_to
    - validation_from
    - validation_to
    - test_from
    - test_to
    additionalProperties: false
  execution:
    type: object
    properties:
      strategy:
        enum:
        - single_process_cpu
      intra_op_threads: &id002
        type: integer
        minimum: 1
      inter_op_threads: *id002
      reader_workers:
        type: integer
        minimum: 0
      prefetch_batches: *id002
      arrow_threads: *id002
      s3_transfer_threads: *id002
      memory_limit_bytes: *id002
      cache_dir: *id001
      cache_limit_bytes: *id002
    required:
    - strategy
    - intra_op_threads
    - inter_op_threads
    - reader_workers
    - prefetch_batches
    - arrow_threads
    - s3_transfer_threads
    - memory_limit_bytes
    - cache_dir
    - cache_limit_bytes
    additionalProperties: false
  seed:
    type: integer
    minimum: 0
  batch_size: *id002
  output:
    type: object
    properties:
      root: *id001
      run_id:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]*$
    required:
    - root
    - run_id
    additionalProperties: false
  features:
    type: array
    items: *id001
    uniqueItems: true
  item_filter: *id001
  feature_default_values:
    type: object
    additionalProperties: {}
  feature_transformations:
    type: array
    items:
      type: object
      properties:
        expr: *id001
        feature_list:
          type: array
          items: *id001
          uniqueItems: true
      required:
      - expr
      additionalProperties: false
  hist_options:
    type: object
    additionalProperties:
      type: object
      properties:
        max_hist_size: *id002
        truncate:
          enum:
          - tail
          - top_weight
        duplicates:
          enum:
          - preserve
          - sum_weights
        tie_break:
          enum:
          - raw_id_ascending
      required:
      - max_hist_size
      - truncate
      - duplicates
      additionalProperties: false
  input_features:
    type: object
    additionalProperties:
      type: object
      properties:
        features:
          type: array
          items: *id001
          minItems: 1
        combiner:
          enum:
          - concat
          - mean
          - weighted_mean
        weight_feature: *id001
      required:
      - features
      additionalProperties: false
  daily:
    type: object
    properties:
      training_window_days: {type: integer, minimum: 1}
    required: [training_window_days]
    additionalProperties: false
  publication:
    type: object
    minProperties: 1
    additionalProperties:
      type: object
      properties:
        metric: {type: string, minLength: 1}
        minimum: {type: number, minimum: 0, maximum: 1}
      required: [metric, minimum]
      additionalProperties: false
  selection: {}
  tasks:
    type: object
    additionalProperties:
      type: object
      properties:
        dims:
          type: array
          items: *id002
        acts:
          type: array
          items:
            enum:
            - relu
            - silu
            - prelu
            - ''
        norms:
          type: array
          items:
            enum:
            - ''
        layer_dropout:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          default: 1
        label: *id001
        mask: *id001
        num_outputs: *id002
        loss_type:
          enum:
          - logloss
          - mseloss
          - softmax_soft
        loss_weight: *id001
        predict_fn:
          enum:
          - sigmoid
          - identity
          - expectation
        metrics:
          type: object
          additionalProperties:
            type: object
            properties:
              func:
                enum:
                - auc
                - regression_auc
                - logloss
                - mae
                - mse
                - rmse
                - valid_rows
                - positive_rate
                - mean
              filter: *id001
              label: *id001
            required:
            - func
            additionalProperties: false
        soft_label:
          type: object
          properties:
            func:
              enum:
              - normal
            scale:
              type: number
              exclusiveMinimum: 0
            sigma:
              type: number
              exclusiveMinimum: 0
          required:
          - func
          - scale
          - sigma
          additionalProperties: false
        output_unit: *id001
        metric_label: *id001
        objective:
          enum:
          - binary:logistic
          - reg:squarederror
      required:
      - label
      - mask
      - loss_type
      - loss_weight
      - predict_fn
      - metrics
      additionalProperties: false
    minProperties: 1
required:
- config_version
- model_name
- model_type
- dataset
- split
- execution
- seed
- batch_size
- output
- features
- item_filter
- feature_default_values
- feature_transformations
- hist_options
- input_features
- selection
- tasks
additionalProperties: false
$schema: https://json-schema.org/draft/2020-12/schema
