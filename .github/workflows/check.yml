name: Train checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DOKU_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.18"
          enable-cache: true
      - run: uv python install 3.12 3.10
      - run: make check
      - run: ./build/build.sh && bash -n build/build.sh build/docker-build.sh
  sagemaker-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build CPU amd64 image (no registry push)
        run: >-
          docker build --platform linux/amd64 -f build/Dockerfile.sagemaker
          --build-arg SOURCE_REVISION="$GITHUB_SHA" -t sagemaker-smoke:local .
      - name: Synthetic DNN and DeepFM train/test/archive/events
        run: >-
          docker run --rm --network none --entrypoint python sagemaker-smoke:local
          -m recommend.train.tests.sagemaker_container_smoke
