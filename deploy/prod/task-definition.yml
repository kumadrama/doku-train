family: "{{PSM_ENV}}"
networkMode: awsvpc
requiresCompatibilities: [FARGATE]
runtimePlatform:
  cpuArchitecture: X86_64
  operatingSystemFamily: LINUX
cpu: "4096"
memory: "16384"
ephemeralStorage:
  sizeInGiB: 100
executionRoleArn: "{{EXECUTION_ROLE}}"
taskRoleArn: doku-prod-taskrole-tree-train
containerDefinitions:
  - name: "{{PSM}}"
    image: "{{IMAGE}}"
    essential: true
    environment:
      - name: PYTHONUNBUFFERED
        value: "1"
    logConfiguration:
      logDriver: awslogs
      options:
        awslogs-group: /ecs/doku-prod/doku-reco-train
        awslogs-region: us-east-2
        awslogs-stream-prefix: ecs
