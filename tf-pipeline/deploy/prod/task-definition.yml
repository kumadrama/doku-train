        },
        {
          "name": "DOKU_BINDING_URI",
          "value": "s3://prod-data-lake-20260901071345278900000001/ml/tf-inference/environment=prod/config/45513e6bea3462f22cc7f42431d39ec62eeee86383bb280c74d19322c859ad12/binding.json"
