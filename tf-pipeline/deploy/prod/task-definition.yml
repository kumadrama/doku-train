{
  "family": "doku-prod-tf-rerank-daily",
  "networkMode": "awsvpc",
  "requiresCompatibilities": [
    "FARGATE"
  ],
  "runtimePlatform": {
    "cpuArchitecture": "X86_64",
    "operatingSystemFamily": "LINUX"
  },
  "cpu": "4096",
  "memory": "8192",
  "ephemeralStorage": {
    "sizeInGiB": 40
  },
  "executionRoleArn": "{{EXECUTION_ROLE}}",
  "taskRoleArn": "doku-prod-tf-rerank-daily-task",
  "containerDefinitions": [
    {
      "name": "pipeline",
      "image": "{{IMAGE}}",
      "essential": true,
      "environment": [
        {
          "name": "DOKU_CONFIG_URI",
          "value": "s3://prod-data-lake-20260901071345278900000001/ml/tf-inference/environment=prod/config/d50b97581fa1b8fff08069c5b914d09e658d271d9d9b3c5d657ff5adc5b7f88b/daily-config.json"
        },
        {
          "name": "DOKU_CONFIG_SHA256",
          "value": "d50b97581fa1b8fff08069c5b914d09e658d271d9d9b3c5d657ff5adc5b7f88b"
        },
        {
          "name": "DOKU_BINDING_URI",
          "value": "s3://prod-data-lake-20260901071345278900000001/ml/tf-inference/environment=prod/config/712aabf76aba274c553a362e3ee321a3a28a7e55ff9f2f202058374d980bb0d6/binding.json"
        },
        {
          "name": "DOKU_BINDING_SHA256",
          "value": "712aabf76aba274c553a362e3ee321a3a28a7e55ff9f2f202058374d980bb0d6"
        }
      ],
      "logConfiguration": {
        "logDriver": "awslogs",
        "options": {
          "awslogs-group": "/ecs/doku-prod-tf-rerank-daily",
          "awslogs-region": "us-east-2",
          "awslogs-stream-prefix": "pipeline"
        }
      }
    }
  ]
}
