{
  "family": "doku-dte-model-worker-smoke",
  "networkMode": "awsvpc",
  "requiresCompatibilities": [
    "FARGATE"
  ],
  "runtimePlatform": {
    "cpuArchitecture": "X86_64",
    "operatingSystemFamily": "LINUX"
  },
  "cpu": "4096",
  "memory": "8192",
  "ephemeralStorage": {
    "sizeInGiB": 40
  },
  "executionRoleArn": "{{EXECUTION_ROLE}}",
  "taskRoleArn": "arn:aws:iam::703844615824:role/doku-dte-taskrole-model-managed-smoke",
  "containerDefinitions": [
    {
      "name": "pipeline",
      "image": "{{IMAGE}}",
      "essential": true,
      "environment": [],
      "logConfiguration": {
        "logDriver": "awslogs",
        "options": {
          "awslogs-group": "/ecs/doku-dte-model-worker-smoke",
          "awslogs-region": "us-east-2",
          "awslogs-stream-prefix": "pipeline"
        }
      },
      "entryPoint": [],
      "command": [
        "python",
        "-m",
        "recommend_tf.platforms.model_management.worker",
        "--help"
      ]
    }
  ]
}
