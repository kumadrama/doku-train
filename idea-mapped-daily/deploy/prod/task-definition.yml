{
  "family": "doku-prod-idea-mapped-daily",
  "taskRoleArn": "doku-prod-idea-mapped-daily-worker",
  "executionRoleArn": "{{EXECUTION_ROLE}}",
  "networkMode": "awsvpc",
  "requiresCompatibilities": [
    "FARGATE"
  ],
  "runtimePlatform": {
    "cpuArchitecture": "X86_64",
    "operatingSystemFamily": "LINUX"
  },
  "cpu": "4096",
  "memory": "8192",
  "ephemeralStorage": {
    "sizeInGiB": 40
  },
  "containerDefinitions": [
    {
      "name": "pipeline",
      "image": "{{IMAGE}}",
      "cpu": 0,
      "portMappings": [],
      "essential": true,
      "entryPoint": [
        "python",
        "-c"
      ],
      "command": [
        "import boto3,os,sys,tarfile,hashlib\np='/tmp/idea-worker.tgz'\nboto3.client('s3').download_file(os.environ['ARTIFACT_BUCKET'],os.environ['ARTIFACT_KEY'],p)\nif hashlib.sha256(open(p,'rb').read()).hexdigest()!=os.environ['ARTIFACT_SHA']: raise ValueError('worker artifact digest differs')\ndst='/tmp/idea-worker'\nos.makedirs(dst)\nwith tarfile.open(p) as tar:\n for entry in tar:\n  if not entry.isfile() or entry.name.startswith('/') or '..' in entry.name.split('/'): raise ValueError('unsafe archive member')\n  tar.extract(entry,dst)\nos.chdir(dst)\nos.environ['PYTHONPATH']=dst\nos.execv(sys.executable,[sys.executable,'-m','recommend_tf.platforms.sagemaker.executor','--region','us-east-2'])"
      ],
      "environment": [
        {
          "name": "ARTIFACT_KEY",
          "value": "ml/sagemaker-experiments/environment=prod/idea-mapped-daily/releases/f8eeb8392a03795cc5e62e2dc89930934a9a2a76c511ca18c46e2346fd1f7d50/worker.tar.gz"
        },
        {
          "name": "DOKU_CONFIG_SHA256",
          "value": "6dedc497983497c5f4c521ab47935ff87a6086425f5f25c647d995c3fb62ce1b"
        },
        {
          "name": "ARTIFACT_BUCKET",
          "value": "prod-data-lake-20260901071345278900000001"
        },
        {
          "name": "DOKU_BINDING_URI",
          "value": "s3://prod-data-lake-20260901071345278900000001/ml/sagemaker-experiments/environment=prod/idea-mapped-daily/releases/b2ec157fe3223aa37ca8e2961cc4fa61158a56f64ef961e8d3799b15eceabae8/binding.json"
        },
        {
          "name": "DOKU_CONFIG_URI",
          "value": "s3://prod-data-lake-20260901071345278900000001/ml/sagemaker-experiments/environment=prod/idea-mapped-daily/releases/6dedc497983497c5f4c521ab47935ff87a6086425f5f25c647d995c3fb62ce1b/daily-config.json"
        },
        {
          "name": "DOKU_BINDING_SHA256",
          "value": "b2ec157fe3223aa37ca8e2961cc4fa61158a56f64ef961e8d3799b15eceabae8"
        },
        {
          "name": "ARTIFACT_SHA",
          "value": "f8eeb8392a03795cc5e62e2dc89930934a9a2a76c511ca18c46e2346fd1f7d50"
        }
      ],
      "mountPoints": [],
      "volumesFrom": [],
      "logConfiguration": {
        "logDriver": "awslogs",
        "options": {
          "awslogs-group": "/ecs/doku-prod-idea-mapped-daily",
          "awslogs-region": "us-east-2",
          "awslogs-stream-prefix": "pipeline"
        }
      },
      "systemControls": []
    }
  ]
}
